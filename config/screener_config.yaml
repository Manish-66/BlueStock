# Nifty 100 Financial Intelligence Platform
# Screener Configuration & Thresholds (Analyst-Editable)
# Sprint 3: Screener & Peer Comparison Engine

presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE compounders with conservative leverage, positive cash generation, and strong 5-year top-line growth."
    filters:
      return_on_equity_pct_min: 15.0
      debt_to_equity_max: 1.0
      free_cash_flow_cr_min: 0.0
      revenue_cagr_5yr_min: 10.0

  value_pick:
    name: "Value Pick"
    description: "Undervalued large caps with sound balance sheets and steady dividend returns."
    filters:
      pe_ratio_max: 30.0
      pb_ratio_max: 4.5
      debt_to_equity_max: 2.0
      dividend_yield_pct_min: 1.0

  growth_accelerator:
    name: "Growth Accelerator"
    description: "Rapidly expanding businesses delivering high profit and revenue CAGR with manageable leverage."
    filters:
      pat_cagr_5yr_min: 20.0
      revenue_cagr_5yr_min: 15.0
      debt_to_equity_max: 2.0

  dividend_champion:
    name: "Dividend Champion"
    description: "High-yielding companies with sustainable payout ratios backed by positive free cash flows."
    filters:
      dividend_yield_pct_min: 2.0
      dividend_payout_max: 80.0
      free_cash_flow_cr_min: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Clean balance sheet leaders with solid equity returns and large-scale revenues (> Rs 5,000 Cr)."
    filters:
      debt_to_equity_max: 0.05
      return_on_equity_pct_min: 12.0
      sales_min: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Companies demonstrating accelerating 3-year revenue, latest year positive FCF, and de-leveraging balance sheets."
    filters:
      revenue_cagr_3yr_min: 10.0
      free_cash_flow_cr_min: 0.0
      de_declining: true

composite_score_weights:
  profitability:
    total: 0.35
    metrics:
      return_on_equity_pct: 0.15
      roce_pct: 0.10
      net_profit_margin_pct: 0.10
  cash_quality:
    total: 0.30
    metrics:
      fcf_cagr_5yr: 0.15
      cfo_pat_ratio: 0.10
      fcf_positive_flag: 0.05
  growth:
    total: 0.20
    metrics:
      revenue_cagr_5yr: 0.10
      pat_cagr_5yr: 0.10
  leverage:
    total: 0.15
    metrics:
      debt_to_equity_score: 0.10
      interest_coverage_score: 0.05

supported_metrics:
  - return_on_equity_pct
  - debt_to_equity
  - free_cash_flow_cr
  - revenue_cagr_5yr
  - pat_cagr_5yr
  - operating_profit_margin_pct
  - pe_ratio
  - pb_ratio
  - dividend_yield_pct
  - interest_coverage
  - market_cap_crore
  - net_profit
  - eps_cagr_5yr
  - asset_turnover
  - sales

sector_rules:
  financials_debt_exemption: true
  debt_free_icr_infinity: true
